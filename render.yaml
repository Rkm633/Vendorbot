services:
  - type: web
    name: vendor-whatsapp-bot
    runtime: go
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: "go mod tidy && CGO_ENABLED=0 go build -ldflags=\"-s -w\" -o main ."
    startCommand: "./main"
    envVars:
      - key: PORT
        value: "8080"
      - key: GOGC
        value: "20"
      - key: GOTOOLCHAIN
        value: "auto"
      - key: CENTRAL_NODE_URL
        sync: false
      - key: VENDOR_API_KEY
        sync: false
